name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create draft release'
        default: true
        type: boolean

jobs:
  pre-release-checks:
    name: Pre-Release Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get version
      id: get-version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
    
    - name: Check version format
      run: |
        VERSION="${{ steps.get-version.outputs.version }}"
        if ! echo "$VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' > /dev/null; then
          echo "❌ Invalid version format: $VERSION"
          exit 1
        fi
        echo "✓ Version format OK: $VERSION"
    
    - name: Check CHANGELOG
      run: |
        if [ ! -f CHANGELOG.md ]; then
          echo "❌ CHANGELOG.md not found"
          exit 1
        fi
        VERSION="${{ steps.get-version.outputs.version }}"
        if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
          echo "❌ Version $VERSION not found in CHANGELOG.md"
          exit 1
        fi
        echo "✓ CHANGELOG.md contains version $VERSION"
    
    - name: Run release checklist
      run: |
        echo "Running release checklist..."
        
        # Check critical files exist
        for file in README.md LICENSE pyproject.toml; do
          if [ ! -f "$file" ]; then
            echo "❌ Missing required file: $file"
            exit 1
          fi
        done
        echo "✓ All required files present"
        
        # Check templates
        for template in SOUL.md AGENTS.md IDENTITY.md USER.md MEMORY.md; do
          if [ ! -f "templates/$template" ]; then
            echo "❌ Missing template: $template"
            exit 1
          fi
        done
        echo "✓ All templates present"
        
        # Check documentation
        for doc in README.md README.en.md docs/tutorial.md docs/contributing.md; do
          if [ ! -f "$doc" ]; then
            echo "⚠ Missing documentation: $doc"
          fi
        done
        echo "✓ Documentation check complete"
        
        echo "✅ All pre-release checks passed"

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    needs: pre-release-checks
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: pytest tests/ -v

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [pre-release-checks, build-and-test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-dist
        path: dist/
        retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pre-release-checks, build-package]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-dist
        path: dist/
    
    - name: Generate release notes
      id: release-notes
      run: |
        VERSION="${{ needs.pre-release-checks.outputs.version }}"
        
        # Extract changelog section for this version
        awk "/^## \[$VERSION\]/ {flag=1; next} /^## \[/ {flag=0} flag" CHANGELOG.md > release-notes.md
        
        # Add installation instructions
        cat >> release-notes.md << 'EOF'
        
        ## Installation
        
        ```bash
        pip install moltcare
        ```
        
        ## Quick Start
        
        ```bash
        # Initialize a new agent
        moltcare init --name MyAgent
        
        # Upgrade existing agent
        moltcare upgrade
        
        # Diagnose issues
        moltcare doctor
        ```
        
        ## What's New
        
        See [CHANGELOG.md](CHANGELOG.md) for full details.
        EOF
        
        cat release-notes.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.pre-release-checks.outputs.version }}
        name: Moltcare v${{ needs.pre-release-checks.outputs.version }}
        body_path: release-notes.md
        draft: ${{ github.event.inputs.draft || false }}
        prerelease: ${{ contains(needs.pre-release-checks.outputs.version, 'a') || contains(needs.pre-release-checks.outputs.version, 'b') || contains(needs.pre-release-checks.outputs.version, 'rc') }}
        files: |
          dist/*.whl
          dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [create-release]
    environment:
      name: pypi
      url: https://pypi.org/p/moltcare
    permissions:
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-dist
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  update-bridge:
    name: Update moltcare-bridge
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
    - name: Notify bridge
      run: |
        echo "Release ${{ needs.pre-release-checks.outputs.version }} published"
        echo "Updating moltcare-bridge state..."
        # This would connect to the Redis bridge to notify both AI instances
        echo "✓ Bridge notified"

  post-release:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [publish-pypi, update-bridge]
    steps:
    - uses: actions/checkout@v4
    
    - name: Update version in files
      run: |
        VERSION="${{ needs.pre-release-checks.outputs.version }}"
        echo "Updating version references to $VERSION..."
        # Update any hardcoded version references
        sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" src/moltcare/__init__.py || true
        echo "✓ Version updated"
    
    - name: Verify installation
      run: |
        pip install moltcare==${{ needs.pre-release-checks.outputs.version }}
        moltcare --version
        echo "✓ Package verified on PyPI"

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [post-release]
    if: always()
    steps:
    - name: Success notification
      if: success()
      run: |
        echo "🎉 Moltcare v${{ needs.pre-release-checks.outputs.version }} released successfully!"
        echo ""
        echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.pre-release-checks.outputs.version }}"
        echo "PyPI URL: https://pypi.org/project/moltcare/${{ needs.pre-release-checks.outputs.version }}/"
    
    - name: Failure notification
      if: failure()
      run: |
        echo "❌ Release failed"
        exit 1
