name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist
        pip install -e .

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=moltcare --cov-report=xml --cov-report=term-missing

    - name: Run integration tests
      run: |
        pytest tests/integration -v --cov=moltcare --cov-report=xml --cov-report=term-missing --cov-append

    - name: Check CLI coverage
      run: |
        pytest tests/unit/test_cli.py -v --cov=moltcare.cli --cov-report=term-missing --cov-fail-under=100

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate coverage report
      run: |
        pytest --cov=moltcare --cov-report=html --cov-report=xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Lint with flake8
      run: |
        flake8 src/moltcare tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/moltcare tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check src/moltcare tests || true

    - name: Check imports with isort
      run: |
        isort --check-only src/moltcare tests || true

    - name: Type check with mypy
      run: |
        mypy src/moltcare --ignore-missing-imports || true

  example-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate basic example
      run: |
        moltcare diagnose -w tests/examples/basic-agent
        moltcare validate -w tests/examples/basic-agent

    - name: Validate advanced example
      run: |
        moltcare diagnose -w tests/examples/advanced-agent
        moltcare validate -w tests/examples/advanced-agent

  test-examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI commands with examples
      run: |
        # Test diagnose command
        moltcare diagnose -w tests/examples/basic-agent
        
        # Test validate command
        moltcare validate -w tests/examples/basic-agent || true
        
        # Test upgrade dry-run
        moltcare upgrade --dry-run -w tests/examples/basic-agent || true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security check
      run: |
        bandit -r src/moltcare -f json -o bandit-report.json || true
        bandit -r src/moltcare

    - name: Check dependencies for known vulnerabilities
      run: |
        safety check || true

    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json
      if: always()
