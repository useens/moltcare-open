name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
        pip install -e ".[dev]"
    
    - name: Check formatting with black
      run: black --check --diff src/ tests/ moltcare/
    
    - name: Check imports with isort
      run: isort --check-only --diff src/ tests/ moltcare/
    
    - name: Lint with flake8
      run: flake8 src/ tests/ moltcare/ --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Type check with mypy
      run: mypy src/ moltcare/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests with coverage
      run: pytest tests/ -v --cov=moltcare --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  test-templates:
    name: Test Template Generation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "."
    
    - name: Test template rendering
      run: |
        python -c "
        from moltcare.templates import TemplateEngine
        engine = TemplateEngine()
        for template in ['SOUL.md', 'AGENTS.md', 'IDENTITY.md', 'USER.md', 'MEMORY.md']:
            result = engine.render(template, {'agent_name': 'TestAgent', 'emoji': '🤖'})
            print(f'✓ {template} rendered successfully')
        print('All templates validated!')
        "
    
    - name: Test CLI init command
      run: |
        cd /tmp
        moltcare init --name TestAgent --template basic --no-interactive
        ls -la TestAgent/
        test -f TestAgent/SOUL.md
        test -f TestAgent/AGENTS.md
        test -f TestAgent/IDENTITY.md
        echo "✓ CLI init command works"

  test-install:
    name: Test Installation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Test pip install
      run: pip install .
    
    - name: Test CLI availability
      run: moltcare --version

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Test moltcare-bridge
      run: |
        python -c "
        import redis
        import json
        import time
        
        r = redis.Redis(host='localhost', port=6379, decode_responses=True)
        
        # Test ping
        assert r.ping(), 'Redis connection failed'
        print('✓ Redis connection OK')
        
        # Test moltcare-bridge protocol
        message = {
            'from': 'ci-test',
            'to': 'test-target',
            'type': 'heartbeat',
            'timestamp': time.time(),
            'data': {'status': 'ok'}
        }
        
        r.publish('moltcare-bridge', json.dumps(message))
        print('✓ Bridge message published')
        
        # Test state storage
        r.hset('moltcare:state', 'ci-test', json.dumps({'phase': 'testing'}))
        state = json.loads(r.hget('moltcare:state', 'ci-test'))
        assert state['phase'] == 'testing'
        print('✓ State storage works')
        
        print('All bridge tests passed!')
        "
    
    - name: Test dual-AI simulation
      run: |
        python tests/integration/test_dual_ai.py || echo "Dual-AI test file not ready yet"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r src/ moltcare/ -f json -o bandit-report.json || true
        bandit -r src/ moltcare/ || true
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: bandit-report.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, test-templates, integration]
    if: always()
    steps:
    - name: Notify success
      if: needs.lint-and-format.result == 'success' && needs.test.result == 'success'
      run: echo "✅ CI completed successfully"
    
    - name: Notify failure
      if: failure()
      run: |
        echo "❌ CI failed"
        exit 1
