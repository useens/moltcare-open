name: Publish to ClawHub

on:
  push:
    branches: [ master, main ]
    paths:
      - 'skill/**'
      # ⚠️ 修改 templates/ 不会自动发布
      # 如需发布，请先将 templates/ 同步到 skill/assets/ 再推送
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install ClawHub CLI
        run: npm install -g clawhub
      
      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          # 从 SKILL.md 提取版本号
          VERSION=$(grep -oP 'v\d+\.\d+\.\d+' skill/SKILL.md | head -1 | sed 's/v//')
          echo "Publishing version: $VERSION"
          # 从 skill/ 目录发布
          clawhub publish ./skill --slug moltcare-open --version "$VERSION"
          
      - name: Notify Success
        if: success()
        run: echo "✅ Skill published successfully!"
