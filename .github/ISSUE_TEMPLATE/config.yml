name: "\U0001F41E Bug Report"
description: File a bug report
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of MoltCare are you running?
      options:
        - v2.3.4 (Latest)
        - v2.3.3
        - v2.3.2
        - Earlier
  - type: dropdown
    id: browsers
    attributes:
      label: OpenClaw Version
      multiple: true
      options:
        - 2026.3.x
        - 2026.2.x
        - 2026.1.x
        - Earlier
