# 超进化模式配置文件 - Token优化版 v2.1
# Hyper-Evolution Mode Configuration v2.1 (Token-Optimized)
# 更新: 2026-02-15 - 大幅优化以降低Token消耗

version: "2.1.0"
codename: "Hyperion-Lean"

# ============ 模式触发配置 ============
triggers:
  command:
    start_keywords:
      - "开始超进化"
      - "启动超进化"
    stop_keywords:
      - "结束超进化"
      - "停止超进化"
  
  duration:
    indefinite: true
    max_duration_hours: 168
    custom_duration_supported: true
  
  events:
    on_major_version_release: true

# ============ 深度学习配置 (优化后) ============
deep_learning:
  # 扫描频率: 每2小时 (原为30分钟，降低75%频率)
  scan_interval_minutes: 120
  
  extraction:
    # Signal阈值: 7 (原为6，提高质量门槛)
    signal_threshold: 7
    # 每源最大提取: 5 (原为10，降低50%)
    max_deep_extract_per_source: 5
    # 最大源数量: 4 (原为8，降低50%)
    max_sources_per_scan: 4
  
  sources:
    enabled:
      - hackernews
      - github_trending
      - moltbook
    discovery:
      enabled: false  # 关闭自动发现

# ============ 知识内化配置 (优化后) ============
knowledge_internalization:
  # 内化频率: 每8小时 (原为4小时)
  interval_hours: 8
  
  forced_internalization:
    high_signal_timeout_hours: 24  # 延长至24小时
    learning_debt_priority: "high"  # 降低优先级
  
  memory_updates:
    min_files_per_session: 1  # 每次仅更新1个文件

# ============ 元学习配置 (优化后) ============
meta_learning:
  enabled: false  # 临时关闭，后续按需开启

# ============ 架构自举配置 (优化后) ============
bootstrapping:
  enabled: false  # 临时关闭，重大变更时手动开启

# ============ 认知升级配置 (优化后) ============
cognitive_upgrade:
  enabled: false  # 临时关闭

# ============ 应用检验配置 (优化后) ============
application_validation:
  require_immediate_application: false  # 关闭强制检验
  validation:
    validation_deadline_hours: 48  # 延长至48小时
    ab_testing_enabled: false
  metrics:
    tracked_indicators:
      - task_completion_rate

# ============ 系统资源配置 (优化后) ============
resource_allocation:
  cpu:
    normal_mode_percent: 30
    hyper_mode_percent: 60  # 降低至60%
  memory:
    normal_mode_mb: 512
    hyper_mode_mb: 1024  # 降低至1GB
  concurrency:
    normal_max_parallel: 3
    hyper_max_parallel: 5  # 降低至5
  long_running_tasks:
    enabled: false  # 关闭长时任务

# ============ 记录与汇报配置 (优化后) ============
logging:
  verbosity: "minimal"  # 极简日志
  status_updates:
    interval_hours: 6  # 每6小时
    include:
      - system_metrics
  evolution_log:
    detailed_logging: false
    decision_logging: false
    failure_logging: true  # 仅记录失败

# ============ 安全配置 ============
safety:
  hard_limits:
    max_cpu_percent: 70  # 降低上限
    max_memory_mb: 2048
    max_disk_usage_percent: 80
  auto_protection:
    auto_downgrade_on_high_load: true
    max_consecutive_failures: 3  # 更敏感

# ============ 退出条件 ============
exit_conditions:
  normal:
    - user_command
    - duration_reached
  emergency:
    - system_overload
    - resource_exhausted
  pre_exit_tasks:
    - generate_evolution_report
    - backup_current_state
