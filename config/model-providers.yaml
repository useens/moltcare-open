# 模型提供商配置 v1.0
# NVIDIA Build 平台模型配置

providers:
  nvidia-build:
    name: "NVIDIA Build"
    baseUrl: "https://integrate.api.nvidia.com/v1"
    apiKey: "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"
    api: "openai-completions"
    enabled: true

# 可用模型列表
models:
  # NVIDIA Build 免费模型
  - id: "nvidia-build/moonshotai/kimi-k2.5"
    name: "kimi-k2.5"
    alias: "k2.5-nvidia"
    provider: nvidia-build
    description: "Kimi K2.5 - 长上下文+图像理解"
    context_window: 262144
    max_tokens: 8192
    thinking: on
    tier: free
    
  - id: "nvidia-build/z-ai/glm4.7"
    name: "glm4.7"
    alias: "glm-nvidia"
    provider: nvidia-build
    description: "GLM-4.7 - 中文优化"
    context_window: 131072
    max_tokens: 4096
    thinking: on
    tier: free
    
  - id: "nvidia-build/stepfun-ai/step-3.5-flash"
    name: "step-3.5-flash"
    alias: "step-nvidia"
    provider: nvidia-build
    description: "Step-3.5-Flash - 快速响应"
    context_window: 128000
    max_tokens: 4096
    thinking: concise
    tier: free

# 默认模型设置
defaults:
  chat: "nvidia-build/moonshotai/kimi-k2.5"
  coding: "nvidia-build/moonshotai/kimi-k2.5"
  fast: "nvidia-build/stepfun-ai/step-3.5-flash"
  chinese: "nvidia-build/z-ai/glm4.7"
