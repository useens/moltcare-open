<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森森拜年卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        .card {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1b2a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* 粒子背景 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(100, 200, 255, 0.6);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 0.3; }
        }
        /* 发光圆环 */
        .ring {
            position: absolute;
            width: 360px;
            height: 360px;
            border: 3px solid rgba(0, 212, 170, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 212, 170, 0.5), inset 0 0 60px rgba(0, 212, 170, 0.1);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
        }
        .ring-inner {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 1px solid rgba(0, 212, 170, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* 数据树 */
        .tree-container {
            position: relative;
            z-index: 10;
            margin-top: -50px;
        }
        .tree {
            width: 200px;
            height: 250px;
            position: relative;
        }
        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 80px;
            background: linear-gradient(180deg, #00d4aa 0%, #00a884 100%);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.5);
        }
        .leaves {
            position: absolute;
            width: 100%;
        }
        .leaf-layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 0 15px rgba(0, 255, 170, 0.6));
        }
        .leaf-1 {
            bottom: 60px;
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 80px solid #00d4aa;
        }
        .leaf-2 {
            bottom: 100px;
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 60px solid #00e6b8;
        }
        .leaf-3 {
            bottom: 130px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 40px solid #00ffaa;
        }
        /* 数据节点 */
        .node {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00ffaa;
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffaa;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
        .node-1 { bottom: 80px; left: 40px; }
        .node-2 { bottom: 80px; right: 40px; }
        .node-3 { bottom: 120px; left: 50px; }
        .node-4 { bottom: 120px; right: 50px; }
        .node-5 { bottom: 160px; left: 50%; transform: translateX(-50%); }
        /* 连接线 */
        .connection-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.4), transparent);
        }
        /* 文字 */
        .title {
            position: absolute;
            top: 180px;
            font-size: 72px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            letter-spacing: 20px;
        }
        .subtitle {
            position: absolute;
            top: 270px;
            font-size: 28px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 4px;
        }
        .signature {
            position: absolute;
            bottom: 260px;
            font-size: 36px;
            color: #00d4aa;
            letter-spacing: 8px;
        }
        .footer {
            position: absolute;
            bottom: 200px;
            font-size: 28px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }
        .year-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            font-weight: bold;
            color: rgba(0, 212, 170, 0.05);
            pointer-events: none;
            letter-spacing: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 粒子背景 -->
        <div class="particles" id="particles"></div>
        
        <!-- 年份背景 -->
        <div class="year-bg">2026</div>
        
        <!-- 发光圆环 -->
        <div class="ring">
            <div class="ring-inner"></div>
        </div>
        
        <!-- 标题 -->
        <div class="title">新年快乐</div>
        <div class="subtitle">Happy Chinese New Year</div>
        
        <!-- 数据树 -->
        <div class="tree-container">
            <div class="tree">
                <div class="trunk"></div>
                <div class="leaves">
                    <div class="leaf-layer leaf-1"></div>
                    <div class="leaf-layer leaf-2"></div>
                    <div class="leaf-layer leaf-3"></div>
                </div>
                <div class="node node-1"></div>
                <div class="node node-2"></div>
                <div class="node node-3"></div>
                <div class="node node-4"></div>
                <div class="node node-5"></div>
            </div>
        </div>
        
        <!-- 签名 -->
        <div class="signature">— 森森 🌲 2026 —</div>
        <div class="footer">来自云端的新年祝福</div>
    </div>
